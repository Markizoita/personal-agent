<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Climb</title>
<!--
  The Climb - game metrics screen (no mountain yet) for the Windows app.
  Renders get_game_state() from the n8n endpoint:
    GET https://bot.marizo.site/webhook/game-state   header  X-Game-Token: <GAME_API_TOKEN from .env>
  Config: set window.CLIMB_CONFIG = { url, token } before this script runs, or pass
  ?url=...&token=... in the page URL. With ?demo=1 it renders sample data instead.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #F6F6F3; --card: #FFFFFF; --line: #E4E4DE; --line-soft: #EFEFEA;
    --ink: #17171B; --muted: #5C5C66; --body: #3F3F46; --locked: #B5B5AE;
    --accent: #C2410C; --accent-ink: #9A3412; --accent-soft: #FDF1EB;
    --earned: #0F766E;
    --p-work: #0F766E; --p-selling: #B45309; --p-shipping: #4F46A5; --p-earning: #9D174D; --p-other: #5C5C66;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  .wrap { width: 100%; max-width: 390px; margin: 0 auto; min-height: 100vh; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 2px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; }
  .bar { background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; }
  .title-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
  .check { width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--locked); background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .check.on { background: var(--earned); border-color: var(--earned); }
  .check span { width: 8px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); display: none; }
  .check.on span { display: block; }
  .tile { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .tile.win { background: var(--earned); border-color: var(--earned); color: #fff; }
  .tile.now { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .tile.off { background: var(--page); }
  .tile.showed { background: #E7F2F0; border-color: var(--earned); color: var(--earned); }
  .tile.miss { background: #fff; border-color: #D6D3CB; color: #8A8A93; }
  .note { border: 1px dashed var(--locked); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .err { background: #FFF4F0; border: 1px solid var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 14px; font-size: 13px; }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><div class="muted small">Loading your climb…</div></main>

<script>
(function () {
  const POWER_COLOR = { Work: 'var(--p-work)', Selling: 'var(--p-selling)', Shipping: 'var(--p-shipping)', Earning: 'var(--p-earning)' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => { const v = Number(n || 0); return Number.isInteger(v) ? String(v) : String(Math.round(v)); };
  const pct = (a, b) => Math.max(0, Math.min(100, b > 0 ? (a / b) * 100 : 0));

  function qty(t) {
    const q = Number(t.quantity);
    if (/hour/i.test(t.task)) { const h = Math.floor(q), m = Math.round((q - h) * 60); return (h ? h + 'h ' : '') + (m || !h ? m + 'm' : '').trim() + ' worked'; }
    if (/money/i.test(t.task)) return '$' + num(q) + ' earned';
    return (q > 1 ? q + '× ' : '') + t.task;
  }

  function render(s) {
    const t = s.today || {};
    const header = (s.title ? esc(s.title) + ' · ' : '') + 'Level ' + s.level;
    const streak = s.streak > 0 ? s.streak + '-day win streak' : 'No streak yet';

    const titles = (s.titles || []).map(ti => `
      <div class="title-row">
        <div class="check ${ti.earned ? 'on' : ''}"><span></span></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600">${esc(ti.name)}</div>
          <div class="small muted">${esc(ti.needs)}</div>
        </div>
        <div class="small" style="font-weight:600;text-align:right;color:${ti.earned ? 'var(--earned)' : 'var(--muted)'}">${ti.earned ? 'Earned' : esc(ti.progress)}</div>
      </div>`).join('');

    const powers = (s.powers || []).map(p => {
      const c = POWER_COLOR[p.power] || 'var(--p-other)';
      return `
      <div style="display:flex;flex-direction:column;gap:5px">
        <div class="row"><span style="font-size:14px;font-weight:600">${esc(p.power)}</span><span style="font-size:13px;font-weight:600;color:${c}">Level ${p.level}</span></div>
        <div class="bar" style="height:8px;border-radius:4px"><div style="width:${pct(p.xp_into_level, 100)}%;background:${c}"></div></div>
        <div class="row tiny muted"><span>${num(p.xp)} XP</span><span>${num(p.xp_to_next)} XP to Level ${p.level + 1}</span></div>
      </div>`;
    }).join('');

    const avg = t.avg_day == null ? null : Number(t.avg_day);
    const scale = Math.max(50, Math.ceil(Math.max(Number(t.xp || 0), avg || 0) * 1.25 / 10) * 10);
    const tasks = (t.tasks || []).map(x => `
      <div class="row" style="padding:9px 0;font-size:13px;border-bottom:1px solid var(--line-soft)">
        <span>${esc(qty(x))} <span class="muted">· ${esc(x.power)}</span></span><span style="font-weight:600">+${num(x.xp)} XP</span>
      </div>`).join('');
    const waiting = t.win_waiting ? `
      <div class="row muted" style="padding:9px 0;font-size:13px">
        <span>Win day, once proof is logged · Work</span><span style="font-weight:600">+${num(t.win_waiting)} XP waiting</span>
      </div>` : '';
    const emptyToday = !tasks && !waiting ? '<div class="small muted" style="padding:9px 0">Nothing logged yet today.</div>' : '';

    const tileClass = r => ({ Win: 'win', Now: 'now', Off: 'off', 'Showed up': 'showed', Miss: 'miss' }[r] || '');
    const tileText = r => ({ Win: 'Win', Now: 'Now', Off: 'Off', 'Showed up': 'In', Miss: 'Miss' }[r] || '');
    // Weekends are Off unless the timer runs - show upcoming Sat/Sun as Off like past ones.
    const resultOf = d => d.result || ((d.day === 'Sat' || d.day === 'Sun') && t.date && d.date > t.date ? 'Off' : null);
    const week = (s.week || []).map(d => ({ ...d, result: resultOf(d) })).map(d => `
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <div class="tile ${tileClass(d.result)}" title="${esc(d.result || '')}">${tileText(d.result)}</div>
        <span>${esc(d.day)}</span>
        <span class="tiny">${d.xp != null && (d.xp > 0 || d.result === 'Now') ? num(d.xp) : ''}</span>
      </div>`).join('');

    document.getElementById('app').innerHTML = `
      <div class="row" style="align-items:flex-end">
        <div><div class="small muted">Your title and level</div><h1>${header}</h1></div>
        <div class="small muted" style="text-align:right">${esc(s.weather)}<br>${streak}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="bar" style="height:10px"><div style="width:${pct(s.xp_into_level, 100)}%;background:var(--accent)"></div></div>
        <div class="row small muted"><span>${num(s.total_xp)} XP total</span><span>${num(s.xp_to_next)} XP to Level ${s.level + 1}</span></div>
      </div>

      <section class="card" aria-label="Titles" style="gap:4px">
        <div class="row" style="margin-bottom:6px"><h2>Titles</h2><span class="small muted">${s.titles_earned} of ${(s.titles || []).length} earned</span></div>
        ${titles}
      </section>

      <section class="card" aria-label="Powers" style="gap:12px">
        <div class="row"><h2>Powers</h2><span class="small muted">Each task feeds one</span></div>
        ${powers}
      </section>

      <section class="card" aria-label="Today's climb" style="gap:10px">
        <div class="row"><h2>Today's climb</h2><span style="font-size:13px;color:var(--accent-ink);font-weight:600">${num(t.xp)} XP${avg != null ? ' · avg ' + num(avg) : ''}</span></div>
        <div style="position:relative;height:22px">
          <div style="position:absolute;left:0;right:0;top:8px;height:8px;background:var(--line);border-radius:4px"></div>
          <div style="position:absolute;left:0;width:${pct(t.xp, scale)}%;top:8px;height:8px;background:var(--accent);border-radius:4px"></div>
          ${avg != null ? `<div style="position:absolute;left:${pct(avg, scale)}%;top:2px;width:2px;height:20px;background:var(--ink)"></div>` : ''}
        </div>
        <div class="row tiny muted"><span>0</span><span>${avg != null ? 'line = your average day' : 'Your average shows after your first full day'}</span><span>${scale}</span></div>
        <div style="display:flex;flex-direction:column;border-top:1px solid var(--line-soft)">${tasks}${waiting}${emptyToday}</div>
      </section>

      <section class="card" aria-label="This week" style="gap:10px">
        <h2>This week</h2>
        <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;color:var(--muted)">${week}</div>
        <div class="small muted">Your streak sets the weather: clear skies on a streak, clouds after a miss, a storm after two in a row.</div>
      </section>

      <section class="note" aria-label="How it works">
        <div style="font-weight:600;margin-bottom:2px">How the climb works</div>
        <div style="color:var(--body)">Level goes up every 100 XP and never caps or drops. Titles are milestones: you earn each one once, in any order, and keep it. A builder can pitch before shipping. Founder needs the other four plus your first dollar.</div>
      </section>`;
  }

  const DEMO = {"title":"Seller","level":4,"total_xp":340,"xp_into_level":40,"xp_to_next":60,"streak":3,"weather":"Clear skies","titles_earned":3,
    "today":{"date":"2026-11-26","xp":20,"avg_day":35,"result":"Now","win_waiting":20,"tasks":[{"task":"Hour worked","power":"Work","quantity":4,"xp":20}]},
    "powers":[{"power":"Work","xp":270,"level":3,"xp_into_level":70,"xp_to_next":30},{"power":"Selling","xp":70,"level":1,"xp_into_level":70,"xp_to_next":30},{"power":"Shipping","xp":0,"level":1,"xp_into_level":0,"xp_to_next":100},{"power":"Earning","xp":0,"level":1,"xp_into_level":0,"xp_to_next":100}],
    "titles":[{"name":"Showing Up","needs":"Your first Win day","earned":true,"progress":"1 of 1"},{"name":"Builder","needs":"5 Win days","earned":true,"progress":"5 of 5"},{"name":"Shipper","needs":"Ship something once","earned":false,"progress":"0 of 1"},{"name":"Seller","needs":"Pitch someone once","earned":true,"progress":"1 of 1"},{"name":"Founder","needs":"The other four, plus your first dollar","earned":false,"progress":"3 of 4"}],
    "week":[{"date":"2026-11-23","day":"Mon","result":"Win","xp":40},{"date":"2026-11-24","day":"Tue","result":"Win","xp":35},{"date":"2026-11-25","day":"Wed","result":"Win","xp":30},{"date":"2026-11-26","day":"Thu","result":"Now","xp":20},{"date":"2026-11-27","day":"Fri","result":null,"xp":null},{"date":"2026-11-28","day":"Sat","result":null,"xp":null},{"date":"2026-11-29","day":"Sun","result":null,"xp":null}]};

  window.ClimbScreen = { render };

  const params = new URLSearchParams(location.search);
  const cfg = Object.assign({}, window.CLIMB_CONFIG || {});
  if (params.get('url')) cfg.url = params.get('url');
  if (params.get('token')) cfg.token = params.get('token');

  if (window.CLIMB_STATE) return render(window.CLIMB_STATE);
  if (params.get('demo') || !cfg.url) return render(DEMO);
  fetch(cfg.url, { headers: cfg.token ? { 'X-Game-Token': cfg.token } : {} })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => render(Array.isArray(d) ? d[0] : d))
    .catch(e => { document.getElementById('app').innerHTML = '<div class="err">Couldn\'t load your climb (' + esc(e.message) + ').</div>'; });
})();
</script>
</body>
</html>
