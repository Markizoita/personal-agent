<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start Up Ops</title>
<link rel="manifest" href="/webhook/dashboard-manifest">
<link rel="icon" href="/webhook/dashboard-icon" type="image/svg+xml">
<meta name="theme-color" content="#F6F6F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F6F3; --card: #FFFFFF; --ink: #17171B; --muted: #5C5C66; --line: #E4E4DE;
    --accent: #C2410C; --accent-ink: #FFFFFF; --done: #0F766E;
    --work: #0F766E; --selling: #B45309; --shipping: #4F46A5; --earning: #9D174D;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140F; --card: #231F19; --ink: #F2EFEA; --muted: #A39C92; --line: #35302A; --accent: #E4752F; --accent-ink: #1C1917;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 48px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; margin: 0; }

  /* login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .box { width: 100%; max-width: 320px; text-align: center; }
  #login h1 { font-size: 22px; margin-bottom: 24px; }
  #login input { width: 100%; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; margin-bottom: 12px; }
  #login button, .btn { width: 100%; padding: 14px 16px; border-radius: var(--radius); border: none; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; cursor: pointer; }
  #login .err { color: var(--accent); font-size: 14px; min-height: 20px; margin-top: 8px; }

  #app { display: none; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--muted); }
  .pill.win { background: #0F766E22; color: var(--done); }
  .pill.miss { background: #C2410C22; color: var(--accent); }
  .pill.off { background: var(--line); color: var(--muted); }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header.top h1 { font-size: 24px; }
  header.top .date { font-size: 13px; color: var(--muted); }
  .logout { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }

  .tabnav { display: flex; gap: 4px; background: var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; overflow-x: auto; }
  .tabnav button { flex: 1; min-height: 40px; padding: 0 14px; border: none; border-radius: 9px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tabnav button.active { background: var(--card); font-weight: 600; }

  .timer-btn { font-size: 17px; padding: 16px; }
  .timer-btn.stop { background: var(--ink); color: var(--bg); }
  h3.todo-group { font-size: 12px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  @media (max-width: 420px) { .tabnav button { padding: 0 6px !important; font-size: 13px !important; } }
  .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .todo-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--done); flex-shrink: 0; }
  .todo-item span.txt { flex: 1; font-size: 15px; }
  .todo-item span.txt.done { text-decoration: line-through; color: var(--muted); }
  .todo-item button.del { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .inline-form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .inline-form input, .inline-form select { flex: 1; min-width: 100px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; }
  .inline-form button { flex-shrink: 0; padding: 10px 16px; border-radius: 10px; border: none; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
  .proof-list div, .tasks-list div { font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 18px 0 8px; }

  /* metrics tab */
  .xpbar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .xpbar > div { height: 100%; background: var(--accent); }
  .title-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .title-chip { flex: 1 1 110px; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); }
  .title-chip.current { border: 2px solid var(--accent); background: #C2410C11; }
  .title-chip .name { font-size: 14px; font-weight: 600; }
  .title-chip .goal { font-size: 12px; color: var(--muted); }
  .next-hint { font-size: 13px; color: #9A3412; background: #FDF1EB; border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric .val { font-size: 22px; font-weight: 700; margin: 2px 0; }
  .metric .delta { font-size: 12px; }
  .metric .delta.up { color: var(--done); } .metric .delta.down { color: var(--accent); }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 20px; margin-top: 6px; }
  .spark div { flex: 1; background: var(--line); border-radius: 2px; min-height: 2px; }
  .power-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .power-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .power-row .name { width: 72px; font-size: 13px; }
  .power-row .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .power-row .bar > div { height: 100%; }
  .power-row .lvl { font-size: 12px; color: var(--muted); width: 48px; text-align: right; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* projects tab */
  .proj-card .stats { display: flex; flex-wrap: wrap; gap: 16px 28px; margin-top: 10px; }
  .proj-card .stat .n { font-family: "Space Grotesk", sans-serif; font-size: 22px; font-weight: 600; }
  .proj-card .stat .l { font-size: 12px; color: var(--muted); }

  /* home + project to-dos */
  .linkbtn { display: block; width: 100%; margin-top: 10px; padding: 6px; background: none; border: none; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; }
  .btn.secondary { background: var(--line); color: var(--ink); margin-top: 8px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; }
  .chip { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .mini { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; font-size: 12px; font-weight: 600; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .proof-prompt { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0 8px 30px; border-bottom: 1px solid var(--line); }
  .proof-prompt input { flex: 1 1 180px; }
  details.more { margin-top: 12px; }
  details.more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  .breakdown { white-space: pre-wrap; font-size: 14px; line-height: 1.55; margin-top: 8px; }
  .overlay { position: fixed; inset: 0; background: #0008; display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal { background: var(--card); color: var(--ink); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .modal h2 { font-size: 20px; margin-bottom: 6px; }
  @media (min-width: 600px) { .overlay { align-items: center; padding: 16px; } .modal { border-radius: 18px; } }
  .outside-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .outside-row .row { flex-wrap: nowrap; }

  /* history tab */
  .hist-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .hist-days { flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px; }
  .hist-day-btn { text-align: left; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: inherit; color: inherit; }
  .hist-day-btn.active { border-color: var(--accent); background: #C2410C0D; }
  .hist-detail { flex: 999 1 320px; min-width: 0; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Start Up Ops</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div><div class="date" id="hdrDate"></div><h1>Start Up Ops</h1></div>
      <button class="logout" onclick="logout()">Log out</button>
    </header>

    <div class="tabnav" id="tabNav">
      <button data-tab="home" class="active">Home</button>
      <button data-tab="metrics">Metrics</button>
      <button data-tab="projects">Projects</button>
      <button data-tab="history">History</button>
      <button data-tab="news">News</button>
    </div>

    <!-- HOME -->
    <div id="tab-home">
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <div><span class="muted" id="todayDate"></span> <span id="todayResult"></span></div>
          <div id="todayMinutes" style="font-size:20px;font-weight:700"></div>
        </div>
        <button class="btn timer-btn" id="timerBtn" onclick="onTimerButton()">Start work</button>
        <button class="linkbtn" id="submitLink" onclick="openSubmit()" style="display:none"></button>
      </div>
      <div class="card" id="breakdownCard" style="display:none">
        <div class="row"><div class="section-title" style="margin:0" id="bdTitle"></div><span id="bdResult"></span></div>
        <div class="breakdown" id="bdText"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">To-dos today</div>
        <div id="todoBox"></div>
        <div class="inline-form">
          <input id="newTodoText" placeholder="Something new to do">
        </div>
        <div class="inline-form">
          <select id="newTodoProject" aria-label="Project"></select>
          <input id="newProjectName" placeholder="New project name" style="display:none">
          <select id="newTodoDay" aria-label="When">
            <option value="today">Today</option>
            <option value="tomorrow">Tomorrow</option>
            <option value="none">Later (project only)</option>
          </select>
          <button onclick="addTodo()">Add</button>
        </div>
        <details class="more" id="backlogBox"><summary id="backlogSummary"></summary><div id="backlogList"></div></details>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Proof</div>
        <div class="proof-list" id="proofBox"></div>
        <div class="inline-form">
          <input id="proofText" placeholder="What did you do?">
          <button onclick="logProof()">Log</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Log a task</div>
        <div class="inline-form">
          <select id="taskSelect"></select>
          <input id="taskQty" placeholder="Qty" style="max-width:70px">
        </div>
        <div class="inline-form">
          <input id="taskNote" placeholder="Note (optional)">
          <button onclick="logTask()">Log</button>
        </div>
        <div class="tasks-list" id="tasksBox" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Tomorrow</div>
        <div id="tomorrowSchedule" class="muted" style="margin-bottom:8px"></div>
        <div id="tomorrowBox"></div>
      </div>
    </div>

    <!-- METRICS -->
    <div id="tab-metrics" style="display:none">
      <div class="card">
        <div class="row">
          <div><div class="muted" id="metLine1"></div><h2 id="metTitle" style="font-size:22px"></h2></div>
        </div>
        <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>
        <div class="title-row" id="titlesBox"></div>
        <div class="next-hint" id="nextHint" style="display:none"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Powers</div>
        <div id="powersBox"></div>
      </div>
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <div class="section-title" style="margin:0">Metrics</div>
          <div class="tabs" id="periodTabs" style="margin:0;width:auto">
            <button data-p="week" class="active">Week</button>
            <button data-p="month">Month</button>
            <button data-p="all">All</button>
          </div>
        </div>
        <div class="metrics-grid" id="metricsGrid"></div>
      </div>
    </div>

    <!-- PROJECTS -->
    <div id="tab-projects" style="display:none">
      <div id="projectsBox"></div>
    </div>

    <!-- HISTORY -->
    <div id="tab-history" style="display:none">
      <div class="hist-wrap">
        <div class="hist-days" id="histDays"></div>
        <div class="card hist-detail" id="histDetail"></div>
      </div>
    </div>

    <!-- NEWS -->
    <div id="tab-news" style="display:none">
      <div class="card" style="border-style:dashed; text-align:center; padding:48px 20px">
        <h2 style="font-size:16px">News agent</h2>
        <p class="muted">Coming after the personal automations are done.</p>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" style="display:none"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://bot.marizo.site/webhook';
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let TOKEN = storage.get('su_token') || null;
let TASK_TABLE = [];
let PERIOD = 'week';
let TIMER_OPEN = false;
let CUR_TAB = 'home';
let HIST_DAYS = [];
let HIST_SEL = null;
let TODAY = '';
let MINUTES_TODAY = 0;
let PREVIEW = null;
let SUBMITTING = false;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayLabel(day) {
  if (!day) return '';
  if (day === TODAY) return 'Today';
  if (TODAY && day === addDays(TODAY, 1)) return 'Tomorrow';
  const nice = new Date(day + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  return TODAY && day < TODAY ? 'was ' + nice : nice;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
async function call(path, body) {
  try {
    const res = await fetch(`${API}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: TOKEN }, body || {})) });
    const json = await res.json();
    if (json.ok === false && json.reason === 'invalid session') { closeModal(); logout(); }
    return json;
  } catch (e) { toast('Network error'); return { ok: false }; }
}
async function doLogin() {
  const pw = document.getElementById('pw').value;
  const res = await fetch(`${API}/dashboard-login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
    .then(r => r.json()).catch(() => ({ ok: false }));
  if (res.ok) { TOKEN = res.token; storage.set('su_token', TOKEN); showApp(); }
  else document.getElementById('loginErr').textContent = 'Wrong password';
}
function logout() {
  storage.remove('su_token'); TOKEN = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}
function fmtHours(mins) { const h = Math.floor(mins / 60), m = Math.round(mins % 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
function resultPill(r) {
  if (!r) return '';
  const cls = r === 'Win' ? 'win' : (r === 'Miss' ? 'miss' : (r === 'Off' ? 'off' : ''));
  return `<span class="pill ${cls}">${r}</span>`;
}
function fmtVal(v, unit) {
  if (unit === 'dollars') return '$' + Math.round(v);
  if (unit === 'hours') return Math.round(v * 10) / 10 + 'h';
  return Math.round(v);
}

/* ---------- tab switching ---------- */
document.querySelectorAll('#tabNav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#tabNav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    CUR_TAB = b.dataset.tab;
    ['home', 'metrics', 'projects', 'history', 'news'].forEach(t =>
      document.getElementById('tab-' + t).style.display = (t === CUR_TAB) ? 'block' : 'none');
    if (CUR_TAB === 'projects') loadProjects();
    if (CUR_TAB === 'history') loadHistory();
  };
});

/* ---------- home ---------- */
async function loadHome() {
  const h = await call('dashboard-home');
  if (!h.ok) return;
  TODAY = h.date;
  MINUTES_TODAY = h.minutes_today || 0;
  $('hdrDate').textContent = h.date_label || '';
  $('todayDate').textContent = h.date_label || '';
  $('todayResult').innerHTML = resultPill(h.result);
  $('todayMinutes').textContent = fmtHours(MINUTES_TODAY);
  TIMER_OPEN = !!(h.session && h.session.open);
  const btn = $('timerBtn');
  btn.textContent = TIMER_OPEN ? 'Stop work' : 'Start work';
  btn.classList.toggle('stop', TIMER_OPEN);

  const sub = h.submit || {};
  const link = $('submitLink');
  link.style.display = TIMER_OPEN ? 'none' : 'block';
  link.textContent = sub.done ? `${sub.label} submitted · submit again` : `Done for today? Submit ${sub.label || ''}`;

  const bd = h.last_breakdown;
  $('breakdownCard').style.display = bd ? 'block' : 'none';
  if (bd) {
    $('bdTitle').textContent = `Breakdown · ${bd.label}`;
    $('bdResult').innerHTML = resultPill(bd.result);
    $('bdText').textContent = bd.text || 'No breakdown was written. Use "submit again" to retry.';
  }

  const box = $('todoBox'); box.innerHTML = '';
  (h.todo_groups || []).forEach(g => {
    const gh = document.createElement('h3'); gh.className = 'todo-group'; gh.textContent = g.project; box.appendChild(gh);
    g.items.forEach(it => box.appendChild(todoRow(it)));
  });
  if (!h.todo_groups || !h.todo_groups.length) box.innerHTML = '<div class="muted">Nothing planned for today.</div>';

  const sel = $('newTodoProject');
  const keep = sel.value;
  sel.innerHTML = (h.projects || []).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('') + '<option value="__new">New project…</option>';
  if (keep && Array.from(sel.options).some(o => o.value === keep)) sel.value = keep;
  $('newProjectName').style.display = sel.value === '__new' ? 'block' : 'none';

  const backlog = h.backlog || [];
  $('backlogBox').style.display = backlog.length ? 'block' : 'none';
  $('backlogSummary').textContent = `From your projects (${backlog.length})`;
  const bl = $('backlogList'); bl.innerHTML = '';
  backlog.forEach(it => bl.appendChild(todoRow(it, { showProject: true })));

  $('proofBox').innerHTML = (h.proof && h.proof.length)
    ? h.proof.map(p => `<div>${esc(p.text)}</div>`).join('')
    : `<div class="muted">${h.win_waiting ? `None yet - +${esc(h.win_waiting)} XP waiting` : 'None yet today.'}</div>`;

  $('tomorrowSchedule').textContent = (h.tomorrow_schedule && h.tomorrow_schedule.length)
    ? 'On your schedule: ' + h.tomorrow_schedule.map(s => s.title).join(', ') : '';
  $('tomorrowBox').innerHTML = (h.tomorrow && h.tomorrow.length)
    ? h.tomorrow.map(t => `<div style="font-size:14px;padding:4px 0"><span class="muted">${esc(t.project)}</span> ${esc(t.text)}</div>`).join('')
    : '<div class="muted">Nothing planned yet.</div>';
}

/* ---------- to-do rows (Home and Projects) ---------- */
function reload() { loadHome(); if (CUR_TAB === 'projects') loadProjects(); }
function todoRow(it, opts) {
  opts = opts || {};
  const wrap = document.createElement('div');
  const row = document.createElement('div'); row.className = 'todo-item';
  const chip = opts.showProject ? it.project : (opts.showDay ? dayLabel(it.day) : '');
  row.innerHTML = `<input type="checkbox" aria-label="Done" ${it.done ? 'checked' : ''}>
    <span class="txt ${it.done ? 'done' : ''}">${esc(it.text)}</span>
    ${chip ? `<span class="chip">${esc(chip)}</span>` : ''}
    ${(opts.showProject || (opts.showDay && it.day !== TODAY)) ? '<button class="mini today">+ Today</button>' : ''}
    <button class="del" aria-label="Delete">✕</button>`;
  const box = row.querySelector('input');
  box.onchange = () => {
    const old = wrap.querySelector('.proof-prompt');
    if (old) old.remove();
    if (it.done) { if (!box.checked) setDone(it.id, false); return; }
    if (box.checked) wrap.appendChild(proofPrompt(it.id));
  };
  const todayBtn = row.querySelector('.today');
  if (todayBtn) todayBtn.onclick = async () => {
    const res = await call('dashboard-schedule-todo', { id: it.id, day: 'today' });
    if (res.ok) { toast('Added to today'); reload(); } else toast('Could not move it');
  };
  row.querySelector('.del').onclick = () => deleteTodo(it.id);
  wrap.appendChild(row);
  return wrap;
}
function proofPrompt(id) {
  const p = document.createElement('div'); p.className = 'proof-prompt';
  p.innerHTML = '<input class="field" placeholder="Proof (optional): link, who, what happened"><button class="mini save">Save proof</button><button class="mini skip">No proof</button>';
  const input = p.querySelector('input');
  const save = () => setDone(id, true, input.value.trim() || null);
  p.querySelector('.save').onclick = () => { if (!input.value.trim()) { input.focus(); return; } save(); };
  p.querySelector('.skip').onclick = () => setDone(id, true, null);
  input.onkeydown = e => { if (e.key === 'Enter' && input.value.trim()) save(); };
  setTimeout(() => input.focus(), 0);
  return p;
}
async function setDone(id, done, proof) {
  const res = await call('dashboard-todo-done', { id, done, proof: proof || null });
  if (res.ok) { if (done) toast(proof ? 'Done, proof saved' : 'Done'); reload(); } else toast('Could not update');
}

/* ---------- metrics ---------- */
document.querySelectorAll('#periodTabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#periodTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); PERIOD = b.dataset.p;
    call('dashboard-progress', { period: PERIOD }).then(renderMetrics);
  };
});
async function loadMetrics() { renderMetrics(await call('dashboard-progress', { period: PERIOD })); }
function renderMetrics(p) {
  if (!p || !p.game) return;
  const g = p.game;
  document.getElementById('metLine1').textContent = `Level ${g.level} · ${g.streak}-day streak`;
  document.getElementById('metTitle').textContent = `${g.title || 'No title yet'} · ${Math.round(g.total_xp)} XP`;
  const pct = Math.max(0, Math.min(100, g.xp_into_level));
  document.getElementById('xpFill').style.width = pct + '%';

  document.getElementById('titlesBox').innerHTML = (g.titles || []).map(t =>
    `<div class="title-chip ${t.earned ? 'current' : ''}"><div class="name">${t.name}</div><div class="goal">${t.earned ? 'Earned' : t.progress}</div></div>`
  ).join('');
  const next = (g.titles || []).find(t => !t.earned);
  const hint = document.getElementById('nextHint');
  if (next) { hint.style.display = 'block'; hint.textContent = `${next.name}: ${next.needs}`; } else { hint.style.display = 'none'; }

  const colors = { Work: 'var(--work)', Selling: 'var(--selling)', Shipping: 'var(--shipping)', Earning: 'var(--earning)' };
  document.getElementById('powersBox').innerHTML = (g.powers || []).map(pw => {
    const pct2 = Math.max(2, Math.min(100, pw.xp_into_level));
    return `<div class="power-row"><div class="dot" style="background:${colors[pw.power]}"></div><div class="name">${pw.power}</div>
      <div class="bar"><div style="width:${pct2}%;background:${colors[pw.power]}"></div></div><div class="lvl">L${pw.level}</div></div>`;
  }).join('');

  document.getElementById('metricsGrid').innerHTML = (p.metrics || []).map(m => {
    const delta = (m.prev != null) ? (m.value - m.prev) : null;
    const deltaStr = delta == null ? '' : (delta > 0 ? `<span class="delta up">▲ ${fmtVal(delta, m.unit)}</span>` : (delta < 0 ? `<span class="delta down">▼ ${fmtVal(Math.abs(delta), m.unit)}</span>` : `<span class="delta muted">no change</span>`));
    const max = Math.max(1, ...(m.last7 || [0]));
    const bars = (m.last7 || []).map(v => `<div style="height:${Math.max(8, (v / max) * 100)}%"></div>`).join('');
    return `<div class="metric"><div class="muted">${m.label}</div><div class="val">${fmtVal(m.value, m.unit)}</div>${deltaStr}<div class="spark">${bars}</div></div>`;
  }).join('');

  TASK_TABLE = g.task_table || [];
  document.getElementById('taskSelect').innerHTML = TASK_TABLE.map(t => `<option value="${t.key}">${t.name}</option>`).join('');
}

/* ---------- projects ---------- */
async function loadProjects() {
  const res = await call('dashboard-projects');
  const box = $('projectsBox');
  if (!res.ok || !res.projects || !res.projects.length) { box.innerHTML = '<div class="card muted">No projects yet.</div>'; return; }
  const openDone = new Set(Array.from(box.querySelectorAll('details[open]')).map(d => d.dataset.name));
  box.innerHTML = '';
  res.projects.forEach(p => {
    const max = Math.max(1, ...(p.last7_hours || [0]));
    const bars = (p.last7_hours || []).map(v => `<div style="height:${Math.max(8, (v / max) * 100)}%"></div>`).join('');
    const card = document.createElement('div'); card.className = 'card proj-card';
    card.innerHTML = `
      <div class="row"><h2 style="font-size:16px">${esc(p.name)}</h2><span class="pill">${esc(p.status)}</span></div>
      <div class="stats">
        <div class="stat"><div class="n">${esc(p.total_hours)}h</div><div class="l">Total hours</div></div>
        <div class="stat"><div class="n">${esc(p.week_hours)}h</div><div class="l">This week</div><div class="spark" style="width:80px">${bars}</div></div>
        <div class="stat"><div class="n">${esc(p.shipped)}</div><div class="l">Shipped</div></div>
        <div class="stat"><div class="n">${esc(p.open_items)}</div><div class="l">Open to-dos</div></div>
      </div>
      <div class="muted" style="margin-top:8px">Last worked: ${esc(p.last_worked || 'never')}</div>
      <div class="section-title">To-do list</div>
      <div class="plist"></div>
      <div class="inline-form">
        <input class="ptext" placeholder="Add to this project (e.g. pitch someone)">
        <input class="pdate" type="date" aria-label="Date (optional)" style="flex:0 1 150px">
        <button class="padd">Add</button>
      </div>`;
    const list = card.querySelector('.plist');
    (p.todos || []).forEach(t => list.appendChild(todoRow(t, { showDay: true })));
    if (!p.todos || !p.todos.length) list.innerHTML = '<div class="muted">No open to-dos.</div>';
    const text = card.querySelector('.ptext');
    const add = async () => {
      if (!text.value.trim()) return;
      const r = await call('dashboard-add-todo', { project: p.name, text: text.value.trim(), day: card.querySelector('.pdate').value || 'none' });
      if (r.ok) { reload(); } else toast('Could not add');
    };
    card.querySelector('.padd').onclick = add;
    text.onkeydown = e => { if (e.key === 'Enter') add(); };
    if (p.recent_done && p.recent_done.length) {
      const d = document.createElement('details'); d.className = 'more'; d.dataset.name = p.name; d.open = openDone.has(p.name);
      d.innerHTML = `<summary>Recently done (${esc(p.done_items)} total)</summary>`;
      p.recent_done.forEach(t => {
        const line = document.createElement('div'); line.className = 'todo-item';
        line.innerHTML = `<input type="checkbox" checked aria-label="Done"><span class="txt done">${esc(t.text)}</span>${t.proof ? '<span class="chip">proof</span>' : ''}`;
        line.querySelector('input').onchange = () => setDone(t.id, false);
        d.appendChild(line);
      });
      card.appendChild(d);
    }
    box.appendChild(card);
  });
}

/* ---------- history ---------- */
async function loadHistory() {
  const res = await call('dashboard-history', { days: '30' });
  HIST_DAYS = (res.days || []);
  renderHistDays();
  if (HIST_DAYS.length) selectHistDay(HIST_DAYS[0].date);
}
function renderHistDays() {
  document.getElementById('histDays').innerHTML = HIST_DAYS.map(d => {
    const ink = d.result === 'Win' ? 'var(--done)' : 'var(--muted)';
    return `<button class="hist-day-btn ${d.date === HIST_SEL ? 'active' : ''}" data-date="${d.date}">
      <span style="font-weight:600">${d.label}</span><span style="font-size:13px;color:${ink};font-weight:600">${d.result || ''} · ${d.hours}h</span>
    </button>`;
  }).join('');
  document.querySelectorAll('.hist-day-btn').forEach(b => b.onclick = () => selectHistDay(b.dataset.date));
}
async function selectHistDay(date) {
  HIST_SEL = date; renderHistDays();
  const d = await call('dashboard-day', { date });
  const box = document.getElementById('histDetail');
  if (!d.ok) { box.innerHTML = '<div class="muted">Could not load that day.</div>'; return; }
  const projRows = (d.projects || []).map(p => `
    <div style="margin-top:10px"><div class="row" style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase"><span>${esc(p.name)}</span><span>${esc(p.hours)}h</span></div>
    ${(p.todos || []).map(t => `<div class="row" style="font-size:14px;padding:4px 0"><span>${esc(t.text)}</span><span style="font-size:12px;font-weight:600;color:${t.done ? 'var(--done)' : 'var(--accent)'}">${t.done ? 'Done' : 'Not done'}</span></div>`).join('')}
    </div>`).join('');
  box.innerHTML = `<div class="row"><h2 style="font-size:18px">${esc(d.label)}</h2><span class="muted">${d.started_at ? 'Started ' + esc(d.started_at) + ' · ' : ''}${esc(d.hours)}h · ${esc(d.result || '')}</span></div>
    ${d.breakdown ? `<div class="breakdown" style="border-bottom:1px solid var(--line);padding-bottom:12px">${esc(d.breakdown)}</div>` : ''}
    ${projRows || '<div class="muted">No project activity.</div>'}
    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:14px"><span class="muted">Proof </span>${(d.proof && d.proof.length) ? d.proof.map(esc).join(', ') : 'none'}</div>`;
}

/* ---------- start / stop / submit ---------- */
function showModal(html) { $('modal').innerHTML = html; $('overlay').style.display = 'flex'; }
function closeModal() { if (SUBMITTING) return; $('overlay').style.display = 'none'; $('modal').innerHTML = ''; }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function onTimerButton() {
  if (!TIMER_OPEN) {
    const res = await call('dashboard-start', { project: 'Personal agent' });
    if (res.ok) { toast('Started'); loadHome(); } else toast(res.reason || 'Something went wrong');
    return;
  }
  showModal(`<h2>Done for today?</h2>
    <p class="muted">Submitting saves your day and Claude writes the breakdown.</p>
    <button class="btn" id="mSubmit">Submit my day</button>
    <button class="btn secondary" id="mBreak">Just a break</button>
    <button class="linkbtn" id="mKeep">Keep working</button>`);
  $('mKeep').onclick = closeModal;
  $('mBreak').onclick = async () => { if (await stopTimer()) { closeModal(); toast('Paused'); loadHome(); } };
  $('mSubmit').onclick = async () => { if (await stopTimer()) { await loadHome(); openSubmit(); } };
}
async function stopTimer() {
  const res = await call('dashboard-stop');
  if (!res.ok) toast(res.reason || 'Could not stop the timer');
  return !!res.ok;
}

async function openSubmit() {
  const p = await call('dashboard-submit-preview');
  if (!p.ok) { toast('Could not open submit'); return; }
  PREVIEW = p;
  const proof = (p.proof || []).length;
  showModal(`<h2>Submit ${esc(p.label)}</h2>
    <p class="muted">${esc(p.hours)}h on the timer · ${esc(p.todos_done)} to-do${p.todos_done === 1 ? '' : 's'} done, ${esc(p.todos_open)} not done · ${proof} proof ${proof === 1 ? 'note' : 'notes'}${p.sessions_seen ? ` · ${esc(p.sessions_seen)} Claude ${p.sessions_seen === 1 ? 'session' : 'sessions'}` : ''}</p>
    <div class="section-title">Anything done outside Claude?</div>
    <div class="muted">Pitches, meetings, claude.ai chats. Add proof if you have it.</div>
    <div id="outsideRows"></div>
    <button class="mini" id="addRow" style="margin-top:10px">+ Add something</button>
    <button class="btn" id="doSubmit" style="margin-top:16px">Submit day</button>
    <button class="linkbtn" id="mCancel">Not yet</button>`);
  $('addRow').onclick = () => addOutsideRow();
  $('mCancel').onclick = closeModal;
  $('doSubmit').onclick = () => submitDay(collectOutside());
}
function addOutsideRow() {
  const row = document.createElement('div'); row.className = 'outside-row';
  const types = ['<option value="other">Other work</option>'].concat((PREVIEW.tasks || []).map(t => `<option value="${esc(t.key)}">${esc(t.name)}</option>`)).join('');
  const projects = ['<option value="">No project</option>'].concat((PREVIEW.projects || []).map(n => `<option value="${esc(n)}">${esc(n)}</option>`)).join('');
  row.innerHTML = `<div class="row"><select class="field otype" aria-label="Type">${types}</select><button class="mini odel" aria-label="Remove">✕</button></div>
    <input class="field owhat" placeholder="What happened?">
    <input class="field oamount" type="number" min="1" placeholder="Amount in dollars" style="display:none">
    <input class="field oproof" placeholder="Proof (optional): link, name, screenshot note">
    <select class="field oproject" aria-label="Project">${projects}</select>`;
  row.querySelector('.odel').onclick = () => row.remove();
  row.querySelector('.otype').onchange = e => { row.querySelector('.oamount').style.display = e.target.value === 'money' ? 'block' : 'none'; };
  $('outsideRows').appendChild(row);
  row.querySelector('.owhat').focus();
}
function collectOutside() {
  return Array.from(document.querySelectorAll('.outside-row')).map(r => ({
    type: r.querySelector('.otype').value,
    what: r.querySelector('.owhat').value.trim(),
    proof: r.querySelector('.oproof').value.trim(),
    quantity: r.querySelector('.otype').value === 'money' ? r.querySelector('.oamount').value : '1',
    project: r.querySelector('.oproject').value
  })).filter(x => x.what || x.proof || x.type !== 'other');
}
async function submitDay(outside) {
  if (outside.some(x => !x.what)) { toast('Say what happened, or remove the empty line'); return; }
  if (outside.some(x => x.type === 'money' && !(Number(x.quantity) > 0))) { toast('Enter the dollar amount'); return; }
  if (SUBMITTING) return;
  SUBMITTING = true;
  const btn = $('doSubmit') || $('retrySubmit');
  if (btn) { btn.disabled = true; btn.textContent = 'Claude is writing your breakdown…'; }
  const res = await call('dashboard-submit', { date: PREVIEW.date, outside });
  SUBMITTING = false;
  if (!TOKEN) return;
  const failed = !res.ok || !res.breakdown;
  showModal(`<div class="row"><h2>${res.ok ? esc(res.label) + ' submitted' : 'Submit did not finish'}</h2>${res.ok ? resultPill(res.result) : ''}</div>
    <div class="breakdown">${esc(res.breakdown || (res.ok ? 'Your day is saved, but the breakdown was not written. ' + (res.problem || '') : 'Nothing was lost. Check your connection and try again.'))}</div>
    ${failed ? '<button class="btn" id="retrySubmit" style="margin-top:16px">Try again</button>' : ''}
    <button class="btn ${failed ? 'secondary' : ''}" id="mDone" style="margin-top:12px">Close</button>`);
  $('mDone').onclick = closeModal;
  if (failed) $('retrySubmit').onclick = () => submitDay(outside);
  loadHome(); loadMetrics();
}

/* ---------- other actions ---------- */
async function deleteTodo(id) { const res = await call('dashboard-todo-delete', { id }); if (res.ok) reload(); else toast('Could not delete'); }
$('newTodoProject').onchange = e => { $('newProjectName').style.display = e.target.value === '__new' ? 'block' : 'none'; };
$('newTodoText').onkeydown = e => { if (e.key === 'Enter') addTodo(); };
async function addTodo() {
  let project = $('newTodoProject').value;
  if (project === '__new') project = $('newProjectName').value.trim();
  const text = $('newTodoText').value.trim();
  if (!text) return;
  if (!project) { toast('Name the new project'); return; }
  const day = $('newTodoDay').value;
  const res = await call('dashboard-add-todo', { project, text, day });
  if (res.ok) {
    $('newTodoText').value = ''; $('newProjectName').value = '';
    if (day === 'none') toast('Saved to ' + project);
    loadHome();
  } else toast('Could not add');
}
async function logProof() {
  const text = $('proofText').value; if (!text) return;
  const res = await call('dashboard-log-proof', { text });
  if (res.ok) { $('proofText').value = ''; toast('Logged'); loadHome(); } else toast('Could not log');
}
async function logTask() {
  const task = $('taskSelect').value;
  const quantity = $('taskQty').value || null;
  const note = $('taskNote').value || null;
  const res = await call('dashboard-log-task', { task, quantity, note });
  if (res.ok) {
    $('taskQty').value = ''; $('taskNote').value = '';
    toast(`+${Math.round(res.xp)} XP`);
    if (res.new_titles && res.new_titles.length) toast('New title: ' + res.new_titles.join(', '));
    loadHome(); if (CUR_TAB === 'metrics') loadMetrics();
  } else toast(res.reason || 'Could not log');
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadHome(); loadMetrics();
}
if (TOKEN) showApp();
</script>
</body>
</html>
