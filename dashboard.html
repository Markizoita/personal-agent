<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start Up Ops</title>
<link rel="manifest" href="/webhook/dashboard-manifest">
<meta name="theme-color" content="#F6F6F3">
<style>
  :root {
    --bg: #F6F6F3;
    --card: #FFFFFF;
    --ink: #1C1917;
    --muted: #78716C;
    --line: #E7E5E4;
    --accent: #C2410C;
    --accent-ink: #FFFFFF;
    --done: #0F766E;
    --work: #0F766E;
    --selling: #B45309;
    --shipping: #4F46A5;
    --earning: #9D174D;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140F;
      --card: #231F19;
      --ink: #F2EFEA;
      --muted: #A39C92;
      --line: #35302A;
      --accent: #E4752F;
      --accent-ink: #1C1917;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1, h2, h3 { font-family: "Space Grotesk", Inter, sans-serif; margin: 0; }
  a { color: inherit; }

  /* ---------- login ---------- */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .box { width: 100%; max-width: 320px; text-align: center; }
  #login h1 { font-size: 22px; margin-bottom: 24px; }
  #login input {
    width: 100%; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 16px; margin-bottom: 12px;
  }
  #login button, .btn {
    width: 100%; padding: 14px 16px; border-radius: var(--radius); border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  #login .err { color: var(--accent); font-size: 14px; min-height: 20px; margin-top: 8px; }

  /* ---------- layout ---------- */
  #app { display: none; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--line); color: var(--muted);
  }
  .pill.win { background: #0F766E22; color: var(--done); }
  .pill.miss { background: #C2410C22; color: var(--accent); }
  .pill.off { background: var(--line); color: var(--muted); }

  /* header / level */
  .header h1 { font-size: 20px; }
  .xpbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .xpbar > div { height: 100%; background: var(--accent); }
  .streak { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tabs button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* metric cards */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric { }
  .metric .val { font-size: 22px; font-weight: 700; margin: 2px 0; }
  .metric .delta { font-size: 12px; }
  .metric .delta.up { color: var(--done); }
  .metric .delta.down { color: var(--accent); }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 20px; margin-top: 6px; }
  .spark div { flex: 1; background: var(--line); border-radius: 2px; min-height: 2px; }

  /* powers */
  .power-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .power-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .power-row .name { width: 72px; font-size: 13px; }
  .power-row .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .power-row .bar > div { height: 100%; }
  .power-row .lvl { font-size: 12px; color: var(--muted); width: 48px; text-align: right; }

  /* titles */
  .titles { display: flex; flex-wrap: wrap; gap: 6px; }
  .title-badge {
    font-size: 12px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
    color: var(--muted);
  }
  .title-badge.earned { background: #0F766E18; color: var(--done); border-color: transparent; font-weight: 600; }

  /* home */
  .timer-btn { font-size: 17px; padding: 16px; }
  .timer-btn.stop { background: var(--ink); color: var(--bg); }
  .todo-group h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .todo-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--done); flex-shrink: 0; }
  .todo-item span { flex: 1; font-size: 15px; }
  .todo-item span.done { text-decoration: line-through; color: var(--muted); }
  .todo-item button { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .inline-form { display: flex; gap: 8px; margin-top: 10px; }
  .inline-form input, .inline-form select { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; }
  .inline-form button { flex-shrink: 0; padding: 10px 16px; border-radius: 10px; border: none; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
  .proof-list div, .tasks-list div { font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 18px 0 8px; }
  .logout { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Start Up Ops</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <div class="row header">
      <div>
        <h1 id="hdrTitle">Start Up Ops</h1>
        <div class="streak" id="hdrLine">Level 1 · 0 XP</div>
      </div>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
    <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>

    <div class="section-title">Progress</div>
    <div class="tabs" id="periodTabs">
      <button data-p="week" class="active">Week</button>
      <button data-p="month">Month</button>
      <button data-p="all">All time</button>
    </div>

    <div class="card">
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>

    <div class="card">
      <div id="powersBox"></div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">Titles</div>
      <div class="titles" id="titlesBox"></div>
    </div>

    <div class="section-title">Today</div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div>
          <div id="todayDate" class="muted"></div>
          <div id="todayResult" style="margin-top:4px"></div>
        </div>
        <div id="todayMinutes" style="font-size:20px;font-weight:700"></div>
      </div>
      <button class="btn timer-btn" id="timerBtn" onclick="toggleTimer()">Start work</button>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">To-dos</div>
      <div id="todoBox"></div>
      <div class="inline-form">
        <input id="newTodoProject" placeholder="Project" style="max-width:110px">
        <input id="newTodoText" placeholder="New to-do">
        <button onclick="addTodo()">Add</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">Proof</div>
      <div class="proof-list" id="proofBox"></div>
      <div class="inline-form">
        <input id="proofText" placeholder="What did you do?">
        <button onclick="logProof()">Log</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">Log a task</div>
      <div class="inline-form">
        <select id="taskSelect"></select>
        <input id="taskQty" placeholder="Qty" style="max-width:70px">
      </div>
      <div class="inline-form">
        <input id="taskNote" placeholder="Note (optional)">
        <button onclick="logTask()">Log</button>
      </div>
      <div class="tasks-list" id="tasksBox" style="margin-top:10px"></div>
    </div>

    <button class="btn" style="background:var(--ink)" onclick="confirmSubmitDay()">Finish today</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://bot.marizo.site/webhook';
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let TOKEN = storage.get('su_token') || null;
let TASK_TABLE = [];
let PERIOD = 'week';
let TIMER_OPEN = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function call(path, body) {
  try {
    const res = await fetch(`${API}/${path}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: TOKEN }, body || {}))
    });
    return await res.json();
  } catch (e) {
    toast('Network error');
    return { ok: false };
  }
}

async function doLogin() {
  const pw = document.getElementById('pw').value;
  const res = await fetch(`${API}/dashboard-login`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  }).then(r => r.json()).catch(() => ({ ok: false }));
  if (res.ok) {
    TOKEN = res.token;
    storage.set('su_token', TOKEN);
    showApp();
  } else {
    document.getElementById('loginErr').textContent = 'Wrong password';
  }
}
function logout() {
  storage.remove('su_token');
  TOKEN = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function fmtHours(mins) {
  const h = Math.floor(mins / 60), m = Math.round(mins % 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function resultPill(r) {
  if (!r) return '';
  const cls = r === 'Win' ? 'win' : (r === 'Miss' ? 'miss' : (r === 'Off' ? 'off' : ''));
  return `<span class="pill ${cls}">${r}</span>`;
}

async function loadAll() {
  const [home, prog] = await Promise.all([ call('dashboard-home'), call('dashboard-progress', { period: PERIOD }) ]);
  if (home.ok === false && home.reason === 'invalid session') { logout(); return; }
  renderHome(home);
  renderProgress(prog);
}

function renderHome(h) {
  document.getElementById('todayDate').textContent = h.date_label || '';
  document.getElementById('todayResult').innerHTML = resultPill(h.result);
  document.getElementById('todayMinutes').textContent = fmtHours(h.minutes_today || 0);
  TIMER_OPEN = !!(h.session && h.session.open);
  const btn = document.getElementById('timerBtn');
  if (TIMER_OPEN) { btn.textContent = 'Stop work'; btn.classList.add('stop'); }
  else { btn.textContent = 'Start work'; btn.classList.remove('stop'); }

  const box = document.getElementById('todoBox');
  box.innerHTML = '';
  (h.todo_groups || []).forEach(g => {
    const gh = document.createElement('h3'); gh.textContent = g.project; box.appendChild(gh);
    g.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'todo-item';
      row.innerHTML = `<input type="checkbox" ${it.done ? 'checked' : ''}>
        <span class="${it.done ? 'done' : ''}">${it.text}</span>
        <button>✕</button>`;
      row.querySelector('input').onchange = e => toggleTodo(it.id, e.target.checked);
      row.querySelector('button').onclick = () => deleteTodo(it.id);
      box.appendChild(row);
    });
  });
  if (!h.todo_groups || !h.todo_groups.length) box.innerHTML = '<div class="muted">Nothing today.</div>';

  const pbox = document.getElementById('proofBox');
  pbox.innerHTML = (h.proof && h.proof.length)
    ? h.proof.map(p => `<div>${p.text}</div>`).join('')
    : `<div class="muted">${h.win_waiting ? `None yet - +${h.win_waiting} XP waiting` : 'None yet today.'}</div>`;
}

function renderProgress(p) {
  if (!p || !p.game) return;
  const g = p.game;
  document.getElementById('hdrLine').textContent =
    `${g.title ? g.title + ' · ' : ''}Level ${g.level} · ${Math.round(g.total_xp)} XP · ${g.streak}-day streak`;
  const pct = Math.max(0, Math.min(100, (g.xp_into_level / 100) * 100));
  document.getElementById('xpFill').style.width = pct + '%';

  const mg = document.getElementById('metricsGrid');
  mg.innerHTML = (p.metrics || []).map(m => {
    const delta = (m.prev != null) ? (m.value - m.prev) : null;
    const deltaStr = delta == null ? '' : (delta > 0 ? `<span class="delta up">▲ ${fmtVal(delta, m.unit)}</span>` : (delta < 0 ? `<span class="delta down">▼ ${fmtVal(Math.abs(delta), m.unit)}</span>` : `<span class="delta muted">no change</span>`));
    const max = Math.max(1, ...(m.last7 || [0]));
    const bars = (m.last7 || []).map(v => `<div style="height:${Math.max(8, (v / max) * 100)}%"></div>`).join('');
    return `<div class="metric"><div class="muted">${m.label}</div>
      <div class="val">${fmtVal(m.value, m.unit)}</div>
      ${deltaStr}
      <div class="spark">${bars}</div></div>`;
  }).join('');

  const colors = { Work: 'var(--work)', Selling: 'var(--selling)', Shipping: 'var(--shipping)', Earning: 'var(--earning)' };
  document.getElementById('powersBox').innerHTML = (g.powers || []).map(pw => {
    const pct2 = Math.max(2, Math.min(100, (pw.xp_into_level / 100) * 100));
    return `<div class="power-row">
      <div class="dot" style="background:${colors[pw.power]}"></div>
      <div class="name">${pw.power}</div>
      <div class="bar"><div style="width:${pct2}%;background:${colors[pw.power]}"></div></div>
      <div class="lvl">L${pw.level}</div>
    </div>`;
  }).join('');

  document.getElementById('titlesBox').innerHTML = (g.titles || []).map(t =>
    `<div class="title-badge ${t.earned ? 'earned' : ''}">${t.name}${t.earned ? '' : ' · ' + t.progress}</div>`
  ).join('');

  TASK_TABLE = g.task_table || [];
  const sel = document.getElementById('taskSelect');
  sel.innerHTML = TASK_TABLE.map(t => `<option value="${t.key}">${t.name}</option>`).join('');
}
function fmtVal(v, unit) {
  if (unit === 'dollars') return '$' + Math.round(v);
  if (unit === 'hours') return v + 'h';
  return Math.round(v);
}

document.querySelectorAll('#periodTabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#periodTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    PERIOD = b.dataset.p;
    call('dashboard-progress', { period: PERIOD }).then(renderProgress);
  };
});

async function toggleTimer() {
  const res = await call(TIMER_OPEN ? 'dashboard-stop' : 'dashboard-start', { project: 'Personal agent' });
  if (res.ok) { toast(TIMER_OPEN ? 'Stopped' : 'Started'); loadAll(); }
  else toast(res.reason || 'Something went wrong');
}
async function toggleTodo(id, done) {
  const res = await call('dashboard-todo-done', { id, done });
  if (res.ok) loadAll(); else toast('Could not update');
}
async function deleteTodo(id) {
  const res = await call('dashboard-todo-delete', { id });
  if (res.ok) loadAll(); else toast('Could not delete');
}
async function addTodo() {
  const project = document.getElementById('newTodoProject').value || 'Personal agent';
  const text = document.getElementById('newTodoText').value;
  if (!text) return;
  const res = await call('dashboard-add-todo', { project, text });
  if (res.ok) { document.getElementById('newTodoText').value = ''; loadAll(); }
  else toast('Could not add');
}
async function logProof() {
  const text = document.getElementById('proofText').value;
  if (!text) return;
  const res = await call('dashboard-log-proof', { text });
  if (res.ok) { document.getElementById('proofText').value = ''; toast('Logged'); loadAll(); }
  else toast('Could not log');
}
async function logTask() {
  const task = document.getElementById('taskSelect').value;
  const quantity = document.getElementById('taskQty').value || null;
  const note = document.getElementById('taskNote').value || null;
  const res = await call('dashboard-log-task', { task, quantity, note });
  if (res.ok) {
    document.getElementById('taskQty').value = '';
    document.getElementById('taskNote').value = '';
    toast(`+${Math.round(res.xp)} XP`);
    if (res.new_titles && res.new_titles.length) toast('New title: ' + res.new_titles.join(', '));
    loadAll();
  } else toast(res.reason || 'Could not log');
}
async function confirmSubmitDay() {
  if (!confirm("Finish today? This locks in today's result.")) return;
  const res = await call('dashboard-submit-day');
  if (res.ok) { toast(`Day closed: ${res.result}`); loadAll(); }
  else toast('Could not finish day');
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
}

if (TOKEN) showApp();
</script>
</body>
</html>
