<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start Up Ops</title>
<link rel="manifest" href="/webhook/dashboard-manifest">
<link rel="icon" href="/webhook/dashboard-icon" type="image/svg+xml">
<meta name="theme-color" content="#F6F6F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F6F3; --card: #FFFFFF; --ink: #17171B; --muted: #5C5C66; --line: #E4E4DE;
    --accent: #C2410C; --accent-ink: #FFFFFF; --done: #0F766E;
    --work: #0F766E; --selling: #B45309; --shipping: #4F46A5; --earning: #9D174D;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140F; --card: #231F19; --ink: #F2EFEA; --muted: #A39C92; --line: #35302A; --accent: #E4752F; --accent-ink: #1C1917;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 48px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; margin: 0; }

  /* login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .box { width: 100%; max-width: 320px; text-align: center; }
  #login h1 { font-size: 22px; margin-bottom: 24px; }
  #login input { width: 100%; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; margin-bottom: 12px; }
  #login button, .btn { width: 100%; padding: 14px 16px; border-radius: var(--radius); border: none; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; cursor: pointer; }
  #login .err { color: var(--accent); font-size: 14px; min-height: 20px; margin-top: 8px; }

  #app { display: none; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--muted); }
  .pill.win { background: #0F766E22; color: var(--done); }
  .pill.miss { background: #C2410C22; color: var(--accent); }
  .pill.off { background: var(--line); color: var(--muted); }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header.top h1 { font-size: 24px; }
  header.top .date { font-size: 13px; color: var(--muted); }
  .logout { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }

  .tabnav { display: flex; gap: 4px; background: var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; overflow-x: auto; }
  .tabnav button { flex: 1; min-height: 40px; padding: 0 14px; border: none; border-radius: 9px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tabnav button.active { background: var(--card); font-weight: 600; }

  .timer-btn { font-size: 17px; padding: 16px; }
  .timer-btn.stop { background: var(--ink); color: var(--bg); }
  .todo-group h3 { font-size: 12px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .todo-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--done); flex-shrink: 0; }
  .todo-item span.txt { flex: 1; font-size: 15px; }
  .todo-item span.txt.done { text-decoration: line-through; color: var(--muted); }
  .todo-item button.del { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .inline-form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .inline-form input, .inline-form select { flex: 1; min-width: 100px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; }
  .inline-form button { flex-shrink: 0; padding: 10px 16px; border-radius: 10px; border: none; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
  .proof-list div, .tasks-list div { font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 18px 0 8px; }

  /* metrics tab */
  .xpbar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .xpbar > div { height: 100%; background: var(--accent); }
  .title-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .title-chip { flex: 1 1 110px; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); }
  .title-chip.current { border: 2px solid var(--accent); background: #C2410C11; }
  .title-chip .name { font-size: 14px; font-weight: 600; }
  .title-chip .goal { font-size: 12px; color: var(--muted); }
  .next-hint { font-size: 13px; color: #9A3412; background: #FDF1EB; border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric .val { font-size: 22px; font-weight: 700; margin: 2px 0; }
  .metric .delta { font-size: 12px; }
  .metric .delta.up { color: var(--done); } .metric .delta.down { color: var(--accent); }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 20px; margin-top: 6px; }
  .spark div { flex: 1; background: var(--line); border-radius: 2px; min-height: 2px; }
  .power-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .power-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .power-row .name { width: 72px; font-size: 13px; }
  .power-row .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .power-row .bar > div { height: 100%; }
  .power-row .lvl { font-size: 12px; color: var(--muted); width: 48px; text-align: right; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* projects tab */
  .proj-card .stats { display: flex; flex-wrap: wrap; gap: 16px 28px; margin-top: 10px; }
  .proj-card .stat .n { font-family: "Space Grotesk", sans-serif; font-size: 22px; font-weight: 600; }
  .proj-card .stat .l { font-size: 12px; color: var(--muted); }

  /* history tab */
  .hist-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .hist-days { flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px; }
  .hist-day-btn { text-align: left; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: inherit; color: inherit; }
  .hist-day-btn.active { border-color: var(--accent); background: #C2410C0D; }
  .hist-detail { flex: 999 1 320px; min-width: 0; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Start Up Ops</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div><div class="date" id="hdrDate"></div><h1>Start Up Ops</h1></div>
      <button class="logout" onclick="logout()">Log out</button>
    </header>

    <div class="tabnav" id="tabNav">
      <button data-tab="home" class="active">Home</button>
      <button data-tab="metrics">Metrics</button>
      <button data-tab="projects">Projects</button>
      <button data-tab="history">History</button>
      <button data-tab="news">News</button>
    </div>

    <!-- HOME -->
    <div id="tab-home">
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <div><span class="muted" id="todayDate"></span> <span id="todayResult"></span></div>
          <div id="todayMinutes" style="font-size:20px;font-weight:700"></div>
        </div>
        <button class="btn timer-btn" id="timerBtn" onclick="toggleTimer()">Start work</button>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">To-dos</div>
        <div id="todoBox"></div>
        <div class="inline-form">
          <input id="newTodoProject" placeholder="Project" style="max-width:110px">
          <input id="newTodoText" placeholder="New to-do">
          <button onclick="addTodo()">Add</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Proof</div>
        <div class="proof-list" id="proofBox"></div>
        <div class="inline-form">
          <input id="proofText" placeholder="What did you do?">
          <button onclick="logProof()">Log</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Log a task</div>
        <div class="inline-form">
          <select id="taskSelect"></select>
          <input id="taskQty" placeholder="Qty" style="max-width:70px">
        </div>
        <div class="inline-form">
          <input id="taskNote" placeholder="Note (optional)">
          <button onclick="logTask()">Log</button>
        </div>
        <div class="tasks-list" id="tasksBox" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Tomorrow</div>
        <div id="tomorrowSchedule" class="muted" style="margin-bottom:8px"></div>
        <div id="tomorrowBox"></div>
      </div>
      <button class="btn" style="background:var(--ink)" onclick="confirmSubmitDay()">Finish today</button>
    </div>

    <!-- METRICS -->
    <div id="tab-metrics" style="display:none">
      <div class="card">
        <div class="row">
          <div><div class="muted" id="metLine1"></div><h2 id="metTitle" style="font-size:22px"></h2></div>
        </div>
        <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>
        <div class="title-row" id="titlesBox"></div>
        <div class="next-hint" id="nextHint" style="display:none"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Powers</div>
        <div id="powersBox"></div>
      </div>
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <div class="section-title" style="margin:0">Metrics</div>
          <div class="tabs" id="periodTabs" style="margin:0;width:auto">
            <button data-p="week" class="active">Week</button>
            <button data-p="month">Month</button>
            <button data-p="all">All</button>
          </div>
        </div>
        <div class="metrics-grid" id="metricsGrid"></div>
      </div>
    </div>

    <!-- PROJECTS -->
    <div id="tab-projects" style="display:none">
      <div id="projectsBox"></div>
    </div>

    <!-- HISTORY -->
    <div id="tab-history" style="display:none">
      <div class="hist-wrap">
        <div class="hist-days" id="histDays"></div>
        <div class="card hist-detail" id="histDetail"></div>
      </div>
    </div>

    <!-- NEWS -->
    <div id="tab-news" style="display:none">
      <div class="card" style="border-style:dashed; text-align:center; padding:48px 20px">
        <h2 style="font-size:16px">News agent</h2>
        <p class="muted">Coming after the personal automations are done.</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://bot.marizo.site/webhook';
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let TOKEN = storage.get('su_token') || null;
let TASK_TABLE = [];
let PERIOD = 'week';
let TIMER_OPEN = false;
let CUR_TAB = 'home';
let HIST_DAYS = [];
let HIST_SEL = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
async function call(path, body) {
  try {
    const res = await fetch(`${API}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: TOKEN }, body || {})) });
    return await res.json();
  } catch (e) { toast('Network error'); return { ok: false }; }
}
async function doLogin() {
  const pw = document.getElementById('pw').value;
  const res = await fetch(`${API}/dashboard-login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
    .then(r => r.json()).catch(() => ({ ok: false }));
  if (res.ok) { TOKEN = res.token; storage.set('su_token', TOKEN); showApp(); }
  else document.getElementById('loginErr').textContent = 'Wrong password';
}
function logout() {
  storage.remove('su_token'); TOKEN = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}
function fmtHours(mins) { const h = Math.floor(mins / 60), m = Math.round(mins % 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
function resultPill(r) {
  if (!r) return '';
  const cls = r === 'Win' ? 'win' : (r === 'Miss' ? 'miss' : (r === 'Off' ? 'off' : ''));
  return `<span class="pill ${cls}">${r}</span>`;
}
function fmtVal(v, unit) {
  if (unit === 'dollars') return '$' + Math.round(v);
  if (unit === 'hours') return v + 'h';
  return Math.round(v);
}

/* ---------- tab switching ---------- */
document.querySelectorAll('#tabNav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#tabNav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    CUR_TAB = b.dataset.tab;
    ['home', 'metrics', 'projects', 'history', 'news'].forEach(t =>
      document.getElementById('tab-' + t).style.display = (t === CUR_TAB) ? 'block' : 'none');
    if (CUR_TAB === 'projects') loadProjects();
    if (CUR_TAB === 'history') loadHistory();
  };
});

/* ---------- home ---------- */
async function loadHome() {
  const h = await call('dashboard-home');
  if (h.ok === false && h.reason === 'invalid session') { logout(); return; }
  document.getElementById('hdrDate').textContent = h.date_label || '';
  document.getElementById('todayDate').textContent = h.date_label || '';
  document.getElementById('todayResult').innerHTML = resultPill(h.result);
  document.getElementById('todayMinutes').textContent = fmtHours(h.minutes_today || 0);
  TIMER_OPEN = !!(h.session && h.session.open);
  const btn = document.getElementById('timerBtn');
  if (TIMER_OPEN) { btn.textContent = 'Stop work'; btn.classList.add('stop'); }
  else { btn.textContent = 'Start work'; btn.classList.remove('stop'); }

  const box = document.getElementById('todoBox'); box.innerHTML = '';
  (h.todo_groups || []).forEach(g => {
    const gh = document.createElement('h3'); gh.className = 'todo-group'; gh.textContent = g.project; box.appendChild(gh);
    g.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'todo-item';
      row.innerHTML = `<input type="checkbox" ${it.done ? 'checked' : ''}><span class="txt ${it.done ? 'done' : ''}">${it.text}</span><button class="del">✕</button>`;
      row.querySelector('input').onchange = e => toggleTodo(it.id, e.target.checked);
      row.querySelector('button').onclick = () => deleteTodo(it.id);
      box.appendChild(row);
    });
  });
  if (!h.todo_groups || !h.todo_groups.length) box.innerHTML = '<div class="muted">Nothing today.</div>';

  document.getElementById('proofBox').innerHTML = (h.proof && h.proof.length)
    ? h.proof.map(p => `<div>${p.text}</div>`).join('')
    : `<div class="muted">${h.win_waiting ? `None yet - +${h.win_waiting} XP waiting` : 'None yet today.'}</div>`;

  document.getElementById('tomorrowSchedule').textContent = (h.tomorrow_schedule && h.tomorrow_schedule.length)
    ? 'On your schedule: ' + h.tomorrow_schedule.map(s => s.title).join(', ') : '';
  const tb = document.getElementById('tomorrowBox');
  tb.innerHTML = (h.tomorrow && h.tomorrow.length)
    ? h.tomorrow.map(t => `<div style="font-size:14px;padding:4px 0"><span class="muted">${t.project}</span> ${t.text}</div>`).join('')
    : '<div class="muted">Nothing planned yet.</div>';
}

/* ---------- metrics ---------- */
document.querySelectorAll('#periodTabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#periodTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); PERIOD = b.dataset.p;
    call('dashboard-progress', { period: PERIOD }).then(renderMetrics);
  };
});
async function loadMetrics() { renderMetrics(await call('dashboard-progress', { period: PERIOD })); }
function renderMetrics(p) {
  if (!p || !p.game) return;
  const g = p.game;
  document.getElementById('metLine1').textContent = `Level ${g.level} · ${g.streak}-day streak`;
  document.getElementById('metTitle').textContent = `${g.title || 'No title yet'} · ${Math.round(g.total_xp)} XP`;
  const pct = Math.max(0, Math.min(100, g.xp_into_level));
  document.getElementById('xpFill').style.width = pct + '%';

  document.getElementById('titlesBox').innerHTML = (g.titles || []).map(t =>
    `<div class="title-chip ${t.earned ? 'current' : ''}"><div class="name">${t.name}</div><div class="goal">${t.earned ? 'Earned' : t.progress}</div></div>`
  ).join('');
  const next = (g.titles || []).find(t => !t.earned);
  const hint = document.getElementById('nextHint');
  if (next) { hint.style.display = 'block'; hint.textContent = `${next.name}: ${next.needs}`; } else { hint.style.display = 'none'; }

  const colors = { Work: 'var(--work)', Selling: 'var(--selling)', Shipping: 'var(--shipping)', Earning: 'var(--earning)' };
  document.getElementById('powersBox').innerHTML = (g.powers || []).map(pw => {
    const pct2 = Math.max(2, Math.min(100, pw.xp_into_level));
    return `<div class="power-row"><div class="dot" style="background:${colors[pw.power]}"></div><div class="name">${pw.power}</div>
      <div class="bar"><div style="width:${pct2}%;background:${colors[pw.power]}"></div></div><div class="lvl">L${pw.level}</div></div>`;
  }).join('');

  document.getElementById('metricsGrid').innerHTML = (p.metrics || []).map(m => {
    const delta = (m.prev != null) ? (m.value - m.prev) : null;
    const deltaStr = delta == null ? '' : (delta > 0 ? `<span class="delta up">▲ ${fmtVal(delta, m.unit)}</span>` : (delta < 0 ? `<span class="delta down">▼ ${fmtVal(Math.abs(delta), m.unit)}</span>` : `<span class="delta muted">no change</span>`));
    const max = Math.max(1, ...(m.last7 || [0]));
    const bars = (m.last7 || []).map(v => `<div style="height:${Math.max(8, (v / max) * 100)}%"></div>`).join('');
    return `<div class="metric"><div class="muted">${m.label}</div><div class="val">${fmtVal(m.value, m.unit)}</div>${deltaStr}<div class="spark">${bars}</div></div>`;
  }).join('');

  TASK_TABLE = g.task_table || [];
  document.getElementById('taskSelect').innerHTML = TASK_TABLE.map(t => `<option value="${t.key}">${t.name}</option>`).join('');
}

/* ---------- projects ---------- */
async function loadProjects() {
  const res = await call('dashboard-projects');
  const box = document.getElementById('projectsBox');
  if (!res.ok || !res.projects || !res.projects.length) { box.innerHTML = '<div class="card muted">No projects yet.</div>'; return; }
  box.innerHTML = res.projects.map(p => {
    const max = Math.max(1, ...(p.last7_hours || [0]));
    const bars = (p.last7_hours || []).map(v => `<div style="height:${Math.max(8, (v / max) * 100)}%"></div>`).join('');
    return `<div class="card proj-card">
      <div class="row"><h2 style="font-size:16px">${p.name}</h2><span class="pill">${p.status}</span></div>
      <div class="stats">
        <div class="stat"><div class="n">${p.total_hours}h</div><div class="l">Total hours</div></div>
        <div class="stat"><div class="n">${p.week_hours}h</div><div class="l">This week</div><div class="spark" style="width:80px">${bars}</div></div>
        <div class="stat"><div class="n">${p.shipped}</div><div class="l">Shipped</div></div>
        <div class="stat"><div class="n">${p.open_items}</div><div class="l">Open items</div></div>
      </div>
      <div class="muted" style="margin-top:8px">Last worked: ${p.last_worked || 'never'}</div>
    </div>`;
  }).join('');
}

/* ---------- history ---------- */
async function loadHistory() {
  const res = await call('dashboard-history', { days: '30' });
  HIST_DAYS = (res.days || []);
  renderHistDays();
  if (HIST_DAYS.length) selectHistDay(HIST_DAYS[0].date);
}
function renderHistDays() {
  document.getElementById('histDays').innerHTML = HIST_DAYS.map(d => {
    const ink = d.result === 'Win' ? 'var(--done)' : 'var(--muted)';
    return `<button class="hist-day-btn ${d.date === HIST_SEL ? 'active' : ''}" data-date="${d.date}">
      <span style="font-weight:600">${d.label}</span><span style="font-size:13px;color:${ink};font-weight:600">${d.result || ''} · ${d.hours}h</span>
    </button>`;
  }).join('');
  document.querySelectorAll('.hist-day-btn').forEach(b => b.onclick = () => selectHistDay(b.dataset.date));
}
async function selectHistDay(date) {
  HIST_SEL = date; renderHistDays();
  const d = await call('dashboard-day', { date });
  const box = document.getElementById('histDetail');
  if (!d.ok) { box.innerHTML = '<div class="muted">Could not load that day.</div>'; return; }
  const projRows = (d.projects || []).map(p => `
    <div style="margin-top:10px"><div class="row" style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase"><span>${p.name}</span><span>${p.hours}h</span></div>
    ${(p.todos || []).map(t => `<div class="row" style="font-size:14px;padding:4px 0"><span>${t.text}</span><span style="font-size:12px;font-weight:600;color:${t.done ? 'var(--done)' : 'var(--accent)'}">${t.done ? 'Done' : 'Not done'}</span></div>`).join('')}
    </div>`).join('');
  box.innerHTML = `<div class="row"><h2 style="font-size:18px">${d.label}</h2><span class="muted">${d.started_at ? 'Started ' + d.started_at + ' · ' : ''}${d.hours}h · ${d.result || ''}</span></div>
    ${projRows || '<div class="muted">No project activity.</div>'}
    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:14px"><span class="muted">Proof </span>${(d.proof && d.proof.length) ? d.proof.join(', ') : 'none'}</div>`;
}

/* ---------- actions ---------- */
async function toggleTimer() {
  const res = await call(TIMER_OPEN ? 'dashboard-stop' : 'dashboard-start', { project: 'Personal agent' });
  if (res.ok) { toast(TIMER_OPEN ? 'Stopped' : 'Started'); loadHome(); } else toast(res.reason || 'Something went wrong');
}
async function toggleTodo(id, done) { const res = await call('dashboard-todo-done', { id, done }); if (res.ok) loadHome(); else toast('Could not update'); }
async function deleteTodo(id) { const res = await call('dashboard-todo-delete', { id }); if (res.ok) loadHome(); else toast('Could not delete'); }
async function addTodo() {
  const project = document.getElementById('newTodoProject').value || 'Personal agent';
  const text = document.getElementById('newTodoText').value; if (!text) return;
  const res = await call('dashboard-add-todo', { project, text });
  if (res.ok) { document.getElementById('newTodoText').value = ''; loadHome(); } else toast('Could not add');
}
async function logProof() {
  const text = document.getElementById('proofText').value; if (!text) return;
  const res = await call('dashboard-log-proof', { text });
  if (res.ok) { document.getElementById('proofText').value = ''; toast('Logged'); loadHome(); } else toast('Could not log');
}
async function logTask() {
  const task = document.getElementById('taskSelect').value;
  const quantity = document.getElementById('taskQty').value || null;
  const note = document.getElementById('taskNote').value || null;
  const res = await call('dashboard-log-task', { task, quantity, note });
  if (res.ok) {
    document.getElementById('taskQty').value = ''; document.getElementById('taskNote').value = '';
    toast(`+${Math.round(res.xp)} XP`);
    if (res.new_titles && res.new_titles.length) toast('New title: ' + res.new_titles.join(', '));
    loadHome(); if (CUR_TAB === 'metrics') loadMetrics();
  } else toast(res.reason || 'Could not log');
}
async function confirmSubmitDay() {
  if (!confirm("Finish today? This locks in today's result.")) return;
  const res = await call('dashboard-submit-day');
  if (res.ok) { toast(`Day closed: ${res.result}`); loadHome(); } else toast('Could not finish day');
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadHome(); loadMetrics();
}
if (TOKEN) showApp();
</script>
</body>
</html>
